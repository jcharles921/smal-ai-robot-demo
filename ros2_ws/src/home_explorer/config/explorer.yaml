# Tuning for the linorobot2 "2wd" robot in Gazebo.
# Distances are measured from the lidar, which sits 12 cm ahead of the
# robot centre; the robot itself is about 0.22 m in radius.
explorer:
  ros__parameters:
    max_speed: 0.25        # m/s   (Nav2 config allows up to 0.5)
    max_turn: 1.0          # rad/s
    stop_dist: 0.6         # m - obstacle straight ahead -> turn in place
    slow_dist: 1.3         # m - start slowing down below this
    side_dist: 0.32        # m - something brushing the side -> turn away
    rate_hz: 10.0
    scan_timeout_s: 0.5    # stop if /scan goes quiet for this long
    enabled: true          # ros2 param set /explorer enabled false  -> pause
    max_runtime_s: 0.0     # 0 = explore forever
